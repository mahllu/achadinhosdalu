<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel da Lu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f0f5;
            font-family: 'Segoe UI', sans-serif;
        }

        .login {
            width: 90%;
            max-width: 420px;
            background-color: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .login h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-top: 0;
            color: #2b2b2b;
        }

        .login p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .login label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .login input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

        .login button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background-color: #A59281;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login button:hover {
            background-color: #8F7C6C;
        }

        #mensagem {
            margin-top: 18px;
            text-align: center;
            color: #b34b4b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Painel da Lu</h1>

        <p>Entre para administrar sua vitrine ♡</p>

        <form id="form-login">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div id="mensagem"></div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin.js"></script>

</body>
</html>
