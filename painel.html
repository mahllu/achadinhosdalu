<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel da Lu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="http:fonts//.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="img/favicon.png">
<link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f1f0f5;
            font-family: 'Segoe UI', sans-serif;
            color: #222;
        }

        .topo {
            background: white;
            padding: 22px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .topo h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 28px;
        }

        .sair {
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 14px;
        }

        .conteudo {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .cabecalho-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .cabecalho-painel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
        }

        .adicionar {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background: #A59281;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .adicionar:hover {
            background: #8F7C6C;
        }

        .lista-produtos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .card-produto {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .card-produto img {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 18px;
        }

        .card-info h3 {
            margin: 5px 0;
        }

        .preco {
            font-weight: 700;
            color: #A59281;
            font-size: 19px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.ativo {
            display: flex;
        }

        .formulario {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
        }

        .formulario h2 {
            font-family: 'Playfair Display', serif;
            margin-top: 0;
        }

        .formulario label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 600;
        }

        .formulario input,
        .formulario select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 11px;
            font-size: 14px;
        }

        .publicar {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: #A59281;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .fechar {
            float: right;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
        }

        #mensagem {
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .lista-produtos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="topo">
        <h1>Painel da Lu</h1>

        <button class="sair" id="btn-sair">
            Sair
        </button>
    </header>

    <main class="conteudo">

        <div class="cabecalho-painel">

            <h2>Produtos cadastrados</h2>

            <button class="adicionar" id="btn-adicionar">
                +
            </button>

        </div>

        <div class="lista-produtos" id="lista-produtos"></div>

    </main>


    <div class="modal" id="modal-produto">

        <div class="formulario">

            <button class="fechar" id="btn-fechar">
                ×
            </button>

            <h2>Novo produto</h2>

            <form id="form-produto">

                <label>Foto</label>

                <input
                    type="file"
                    id="imagem"
                    accept="image/*"
                    required
                >


                <label>Nome do produto</label>

                <input
                    type="text"
                    id="nome"
                    required
                >


                <label>Preço</label>

                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    placeholder="129.90"
                    required
                >


                <label>Loja</label>

                <input
                    type="text"
                    id="loja"
                    placeholder="SHEIN"
                    required
                >


                <label>Categoria</label>

<div class="categorias-produto">

    <label>
        <input type="checkbox" name="categoria" value="roupas">
        Roupas
    </label>

    <label>
        <input type="checkbox" name="categoria" value="conjuntos">
        Conjuntos
    </label>

    <label>
        <input type="checkbox" name="categoria" value="pre-adolescentes">
        Pré-adolescentes
    </label>

    <label>
        <input type="checkbox" name="categoria" value="tenis">
        Tênis
    </label>

    <label>
        <input type="checkbox" name="categoria" value="vestidos">
        Vestidos
    </label>

    <label>
        <input type="checkbox" name="categoria" value="bolsas">
        Bolsas
    </label>

    <label>
        <input type="checkbox" name="categoria" value="acessorios">
        Acessórios
    </label>

    <label>
        <input type="checkbox" name="categoria" value="beleza">
        Beleza
    </label>

    <label>
        <input type="checkbox" name="categoria" value="casa">
        Casa
    </label>

</div>


                <label>Link de afiliado</label>

                <input
                    type="url"
                    id="link"
                    placeholder="https://..."
                    required
                >


                <button class="publicar" type="submit">
                    Publicar produto
                </button>

                <p id="mensagem"></p>

            </form>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/painel.js"></script>

</body>
</html>
